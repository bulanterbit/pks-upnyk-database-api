<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pengajuan PKS</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <link rel="stylesheet" href="./style/index.css">

</head>

<body>
  <!-- Navbar -->
  <header>
    <div class="container">
      <div class="navbar">
        <div class="navbar-brand">
          <img src="img/logo_upn.png" alt="Logo" class="navbar-logo" />
          <h1>Pengajuan PKS UPNYK</h1>
        </div>
        <button class="login-button" id="loginBtn">
          <i class="fas fa-sign-in-alt"></i>
          <span>Login</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Login Modal -->
  <div id="loginModal" class="login-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Login Admin</h2>
        <span class="close-btn">&times;</span>
      </div>
      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required />
        </div>
        <button type="submit" class="login-submit">Login</button>
        <div id="errorMessage" class="error-message">
          Username atau password salah!
        </div>
      </form>
    </div>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <div class="container">
      <div class="content-container">
        <!-- Search and Button Section -->
        <div class="action-container">
          <div class="search-box">
            <input type="text" id="searchInput" placeholder="Cari berdasarkan judul, institusi, atau status" />
            <button class="search-button" id="searchButton">
              <i class="fas fa-search"></i>
            </button>
          </div>
          <a href="form.html" class="add-button">
            <i class="fas fa-plus"></i>
            <span>Buat PKS</span>
          </a>
        </div>

        <!-- Loading indicator -->
        <div id="loading" class="loading">
          <i class="fas fa-spinner fa-2x"></i>
          <p>Memuat data...</p>
        </div>

        <!-- Error message container -->
        <div id="errorContainer" class="error-container"></div>

        <!-- Table Section -->
        <div class="table-responsive">
          <table id="pksTable">
            <thead>
              <tr>
                <th data-sort="judul">Judul <i class="fas fa-sort sort-icon"></i></th>
                <th data-sort="pihakKesatu">Pihak Kesatu <i class="fas fa-sort sort-icon"></i></th>
                <th data-sort="pihakKedua">Pihak Kedua <i class="fas fa-sort sort-icon"></i></th>
                <th data-sort="tanggal">Tanggal <i class="fas fa-sort sort-icon"></i></th>
                <th data-sort="status">Status <i class="fas fa-sort sort-icon"></i></th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <!-- Data will be loaded here -->
            </tbody>
          </table>
        </div>
        <div id="noResults" class="no-results">Tidak ada hasil yang ditemukan</div>
      </div>
    </div>
  </div>

  <script src="./script/index.js"></script>
</body>

</html>
