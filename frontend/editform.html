<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Form Perjanjian Kerja Sama</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <style>
    .navbar-custom {
      background-color: #2e7d32;
      padding: 15px 0;
    }

    .navbar-brand {
      color: white !important;
      font-weight: bold;
      margin-left: 20px;
      font-size: 24px;
    }

    body {
      font-size: 14px;
    }

    .form-section {
      margin-bottom: 20px;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 5px;
    }

    .section-title {
      background-color: #f8f9fa;
      padding: 8px;
      margin-bottom: 15px;
      border-radius: 5px;
      font-size: 16px;
    }

    .form-label {
      font-size: 14px;
      margin-bottom: 5px;
    }

    .form-control,
    .form-select,
    .btn {
      font-size: 14px;
      padding: 6px 12px;
    }

    .array-item {
      border: 1px solid #eee;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 4px;
      position: relative;
    }

    .input-group {
      display: flex;
      align-items: center;
    }

    .input-group .form-control {
      border-radius: 4px 0 0 4px !important;
    }

    .remove-btn {
      border-radius: 0 4px 4px 0 !important;
      padding: 6px 12px;
      height: 100%;
      margin-left: -1px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    textarea.form-control {
      min-height: 80px;
    }

    .cols-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    @media (max-width: 768px) {
      .cols-3 {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <header class="bg-green-700 text-white shadow-md">
    <div class="container mx-auto flex justify-between items-center px-6 py-4">
      <div class="flex items-center">
        <img src="img/logo_upn.png" alt="Logo" class="h-12 mr-4" />
        <h1 class="text-2xl font-bold">Pengajuan PKS UPNYK</h1>
      </div>
    </div>
  </header>

  <div class="container mx-auto px-6 py-8">
    <a href="adminview.html" class="text-green-600 hover:text-green-800 flex items-center">
      <i class="fas fa-arrow-left mr-2"></i> Kembali ke Daftar PKS
    </a>
  </div>

  <div class="container mt-3 mb-4">
    <form id="perjanjianForm">
      <!-- Informasi Dokumen -->
      <div class="form-section">
        <div class="section-title">
          <h2 style="font-size: 16px">Informasi Dokumen</h2>
        </div>
        <div class="cols-3">
          <div class="form-elem">
            <label class="form-label">Nomor Dokumen</label>
            <input type="text" class="form-control" name="content.nomor" placeholder="Nomor dokumen" readonly />
          </div>
          <div class="form-elem">
            <label class="form-label">Judul Perjanjian</label>
            <input type="text" class="form-control" name="content.judul" placeholder="Judul perjanjian" required />
          </div>
          <div class="form-elem">
            <label class="form-label">Tanggal</label>
            <input type="date" class="form-control" name="content.tanggal" required />
          </div>
        </div>
      </div>

      <!-- Pihak Kedua (Mitra) -->
      <div class="form-section">
        <div class="section-title">
          <h2 style="font-size: 16px">Pihak Kedua (Mitra)</h2>
        </div>
        <div class="cols-3">
          <div class="form-elem">
            <label class="form-label">Instansi</label>
            <input type="text" class="form-control" name="pihakKedua.instansi" placeholder="Nama instansi" required />
          </div>
          <div class="form-elem">
            <label class="form-label">Nama</label>
            <input type="text" class="form-control" name="pihakKedua.nama" placeholder="Nama perwakilan" required />
          </div>
          <div class="form-elem">
            <label class="form-label">Jabatan</label>
            <input type="text" class="form-control" name="pihakKedua.jabatan" placeholder="Jabatan perwakilan"
              required />
          </div>
          <div class="form-elem">
            <label class="form-label">Alamat</label>
            <input type="text" class="form-control" name="pihakKedua.alamat" placeholder="Alamat mitra" required />
          </div>
          <div class="form-elem">
            <label class="form-label">Nomor</label>
            <input type="text" class="form-control" name="pihakKedua.nomor" placeholder="Nomor kontak" />
          </div>
        </div>
      </div>

      <!-- Properties -->
      <div class="form-section">
        <div class="section-title">
          <h2 style="font-size: 16px">Properties</h2>
        </div>
        <div class="cols-3">
          <div class="form-elem">
            <label class="form-label">Status</label>
            <select class="form-select" name="properties.status" required>
              <option value="draft">Draft</option>
              <option value="menunggu dokumen">Menunggu Dokumen</option>
              <option value="menunggu review">Menunggu Review</option>
              <option value="approved">Approved</option>
              <option value="rejected">Rejected</option>
            </select>
          </div>
          <div class="form-elem">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" name="properties.email" placeholder="Email kontak" required />
          </div>
          <div class="form-elem">
            <label class="form-label">Komentar</label>
            <input type="text" class="form-control" name="properties.comment" placeholder="Komentar" />
          </div>
        </div>
      </div>

      <!-- File Upload -->
      <div class="form-section">
        <div class="section-title">
          <h2 style="font-size: 16px">File Upload</h2>
        </div>
        <div class="cols-3">
          <div class="form-elem">
            <label class="form-label">Nama Dokumen</label>
            <input type="text" class="form-control" name="fileUpload.docName" placeholder="Nama file dokumen" />
          </div>
          <div class="form-elem">
            <label class="form-label">Path Dokumen</label>
            <input type="text" class="form-control" name="fileUpload.docPath" placeholder="Path file dokumen" />
          </div>
          <div class="form-elem">
            <label class="form-label">Nama Logo</label>
            <input type="text" class="form-control" name="fileUpload.logoName" placeholder="Nama file logo" />
          </div>
          <div class="form-elem">
            <label class="form-label">Path Logo</label>
            <input type="text" class="form-control" name="fileUpload.logoPath" placeholder="Path file logo" />
          </div>
          <div class="form-elem">
            <label class="form-label">Upload Dokumen Baru</label>
            <input type="file" class="form-control" name="newDocUpload" accept=".pdf" />
          </div>
          <div class="form-elem">
            <label class="form-label">Upload Logo Baru</label>
            <input type="file" class="form-control" name="newLogoUpload" accept="image/*" />
          </div>
        </div>
      </div>

      <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
        <button type="button" class="btn btn-secondary me-md-2 btn-sm">
          Batal
        </button>
        <button type="submit" class="btn btn-primary btn-sm">
          Simpan Perubahan
        </button>
      </div>
    </form>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script>
    $(document).ready(function () {
      // Get the ID from URL parameters
      const urlParams = new URLSearchParams(window.location.search);
      const pksId = urlParams.get('id');

      if (pksId) {
        // Fetch the PKS data when page loads if there's an ID
        fetchPKSData(pksId);
      }

      // Handle form submission
      $("#perjanjianForm").submit(function (e) {
        e.preventDefault();

        // Prepare the form data
        const formData = {};
        $(this).serializeArray().forEach(item => {
          // Handle nested properties
          const keys = item.name.split('.');
          let current = formData;

          for (let i = 0; i < keys.length - 1; i++) {
            const key = keys[i];
            current[key] = current[key] || {};
            current = current[key];
          }

          current[keys[keys.length - 1]] = item.value;
        });

        // Handle file uploads
        const docFile = $('input[name="newDocUpload"]')[0].files[0];
        const logoFile = $('input[name="newLogoUpload"]')[0].files[0];

        if (docFile || logoFile) {
          const fileData = new FormData();
          if (docFile) fileData.append('docFile', docFile);
          if (logoFile) fileData.append('logoFile', logoFile);
          fileData.append('jsonData', JSON.stringify(formData));

          updatePKSWithFiles(pksId, fileData);
        } else {
          updatePKS(pksId, formData);
        }
      });
    });

    async function fetchPKSData(id) {
      try {
        const response = await fetch(`http://localhost:3000/api/pks/${id}`);

        if (!response.ok) {
          throw new Error('Network response was not ok');
        }

        const data = await response.json();

        if (data.success && data.data) {
          populateForm(data.data);
        }
      } catch (error) {
        console.error('Error fetching PKS data:', error);
        alert('Error loading PKS data: ' + error.message);
      }
    }

    function populateForm(pksData) {
      // Helper function to set value for a form element
      function setValue(selector, value) {
        const element = document.querySelector(`[name="${selector}"]`);
        if (element && value !== undefined && value !== null) {
          if (element.type === 'checkbox') {
            element.checked = value;
          } else if (element.type === 'date' && value instanceof Date) {
            element.value = value.toISOString().split('T')[0];
          } else {
            element.value = value;
          }
        }
      }

      // Content
      if (pksData.content) {
        setValue('content.nomor', pksData.content.nomor);
        setValue('content.judul', pksData.content.judul);
        setValue('content.tanggal', pksData.content.tanggal ? new Date(pksData.content.tanggal) : null);
      }

      // Pihak Kedua
      if (pksData.pihakKedua) {
        setValue('pihakKedua.instansi', pksData.pihakKedua.instansi);
        setValue('pihakKedua.nama', pksData.pihakKedua.nama);
        setValue('pihakKedua.jabatan', pksData.pihakKedua.jabatan);
        setValue('pihakKedua.alamat', pksData.pihakKedua.alamat);
        setValue('pihakKedua.nomor', pksData.pihakKedua.nomor);
      }

      // Properties
      if (pksData.properties) {
        setValue('properties.status', pksData.properties.status);
        setValue('properties.email', pksData.properties.email);
        setValue('properties.comment', pksData.properties.comment);
      }

      // File Upload
      if (pksData.fileUpload) {
        setValue('fileUpload.docName', pksData.fileUpload.docName);
        setValue('fileUpload.docPath', pksData.fileUpload.docPath);
        setValue('fileUpload.logoName', pksData.fileUpload.logoName);
        setValue('fileUpload.logoPath', pksData.fileUpload.logoPath);
      }
    }

    async function updatePKS(id, data) {
      try {
        // Add updated by and timestamp
        data.diperbaraiOleh = "admin"; // Replace with actual user
        data.diperbaraiPada = new Date();

        const response = await fetch(`http://localhost:3000/api/pks/${id}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(data),
        });

        if (!response.ok) {
          const errorData = await response.json();
          throw new Error(errorData.message || 'Failed to update PKS');
        }

        const result = await response.json();

        if (result.success) {
          alert('PKS berhasil diperbarui!');
          window.location.href = 'adminview.html';
        } else {
          throw new Error(result.message || 'Gagal memperbarui PKS');
        }
      } catch (error) {
        console.error('Error:', error);
        alert('Error: ' + error.message);
      }
    }

    async function updatePKSWithFiles(id, formData) {
      try {
        const response = await fetch(`http://localhost:3000/api/pks/${id}/upload`, {
          method: 'PUT',
          body: formData,
        });

        if (!response.ok) {
          const errorData = await response.json();
          throw new Error(errorData.message || 'Failed to update PKS with files');
        }

        const result = await response.json();

        if (result.success) {
          alert('PKS dan file berhasil diperbarui!');
          window.location.href = 'adminview.html';
        } else {
          throw new Error(result.message || 'Gagal memperbarui PKS dengan file');
        }
      } catch (error) {
        console.error('Error:', error);
        alert('Error: ' + error.message);
      }
    }
  </script>
</body>

</html>
