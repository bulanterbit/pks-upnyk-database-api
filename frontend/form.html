<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Perjanjian Kerja Sama</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
        .navbar-custom {
            background-color: #2e7d32;
            padding: 15px 0;
        }

        .navbar-brand {
            color: white !important;
            font-weight: bold;
            margin-left: 20px;
            font-size: 24px;
        }

        body {
            font-size: 14px;
        }

        .form-section {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .section-title {
            background-color: #f8f9fa;
            padding: 8px;
            margin-bottom: 15px;
            border-radius: 5px;
            font-size: 16px;
        }

        .form-label {
            font-size: 14px;
            margin-bottom: 5px;
        }

        .form-control,
        .form-select,
        .btn {
            font-size: 14px;
            padding: 6px 12px;
        }

        .cols-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        @media (max-width: 768px) {
            .cols-3 {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <header class="bg-green-700 text-white shadow-md">
        <div class="container mx-auto flex justify-between items-center px-6 py-4">
            <div class="flex items-center">
                <img src="img/logo_upn.png" alt="Logo" class="h-12 mr-4" />
                <h1 class="text-2xl font-bold">Form Kerjasama</h1>
            </div>
        </div>
    </header>

    <div class="container mx-auto px-6 py-8">
        <a href="index.html" class="text-green-600 hover:text-green-800 flex items-center">
            <i class="fas fa-arrow-left mr-2"></i> Kembali ke Daftar PKS
        </a>
    </div>

    <div class="container mb-4">
        <form id="perjanjianForm">
            <!-- Informasi Dokumen -->
            <div class="form-section">
                <div class="section-title">
                    <h2 style="font-size: 16px;">Informasi Dokumen</h2>
                </div>
                <div class="cols-3">
                    <div class="form-elem">
                        <label class="form-label">Judul Perjanjian</label>
                        <input type="text" class="form-control" name="content.judul" placeholder="Judul perjanjian"
                            required>
                    </div>
                    <div class="form-elem">
                        <label class="form-label">Tanggal Perjanjian</label>
                        <input type="date" class="form-control" name="content.tanggal" required>
                    </div>
                </div>
            </div>

            <!-- Pihak Kedua (Mitra) -->
            <div class="form-section">
                <div class="section-title">
                    <h2 style="font-size: 16px;">Pihak Kedua (Mitra)</h2>
                </div>
                <div class="cols-3">
                    <div class="form-elem">
                        <label class="form-label">Nama Instansi</label>
                        <input type="text" class="form-control" name="pihakKedua.instansi" placeholder="Nama Instansi"
                            required>
                    </div>
                    <div class="form-elem">
                        <label class="form-label">Nama Perwakilan</label>
                        <input type="text" class="form-control" name="pihakKedua.nama" placeholder="Nama perwakilan"
                            required>
                    </div>
                    <div class="form-elem">
                        <label class="form-label">Jabatan</label>
                        <input type="text" class="form-control" name="pihakKedua.jabatan"
                            placeholder="Jabatan perwakilan" required>
                    </div>
                    <div class="form-elem">
                        <label class="form-label">Alamat</label>
                        <input type="text" class="form-control" name="pihakKedua.alamat" placeholder="Alamat mitra"
                            required>
                    </div>
                    <div class="form-elem">
                        <label class="form-label">Nomor Pihak Kedua</label>
                        <input type="text" class="form-control" name="pihakKedua.nomor"
                            placeholder="Nomor pihak kedua (opsional)">
                    </div>
                    <div class="form-elem">
                        <label class="form-label">Email Kontak</label>
                        <input type="email" class="form-control" name="properties.email" placeholder="Email kontak"
                            required>
                    </div>
                    <div class="form-elem">
                        <label class="form-label">Logo Mitra</label>
                        <input type="file" class="form-control" name="logo" accept="image/*" id="logoFile">
                    </div>
                </div>
            </div>

            <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                <button type="button" class="btn btn-secondary me-md-2 btn-sm" id="cancelButton">Batal</button>
                <button type="submit" class="btn btn-primary btn-sm">Simpan dan Kirim Email</button>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Form submission - Save data to backend API
        document.getElementById('perjanjianForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            try {
                // Collect form data
                const formData = new FormData(this);
                const data = {
                    content: {},
                    pihakKedua: {},
                    properties: {
                        status: "draft",
                        uploadDate: new Date().toISOString()
                    }
                };

                // Convert FormData to object with the expected structure
                formData.forEach((value, key) => {
                    // Handle nested objects
                    const keys = key.split('.');

                    if (keys.length > 1) {
                        if (!data[keys[0]]) {
                            data[keys[0]] = {};
                        }
                        data[keys[0]][keys[1]] = value;
                    } else if (key !== 'logo') { // Skip file inputs for now
                        data[key] = value;
                    }
                });

                // Convert tanggal to Date object
                if (data.content.tanggal) {
                    data.content.tanggal = new Date(data.content.tanggal).toISOString();
                }

                // Send data to backend API to create PKS
                const response = await fetch('http://localhost:3000/api/pks', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });

                if (!response.ok) {
                    throw new Error('Gagal menyimpan data');
                }

                const result = await response.json();
                const pksId = result.data._id;

                // Handle logo upload if a file was selected
                const logoFile = document.getElementById('logoFile').files[0];
                if (logoFile && pksId) {
                    const logoFormData = new FormData();
                    logoFormData.append('logo', logoFile);

                    const logoResponse = await fetch(`http://localhost:3000/api/upload/logo/${pksId}`, {
                        method: 'POST',
                        body: logoFormData
                    });

                    if (!logoResponse.ok) {
                        console.warn('Logo berhasil diupload tetapi gagal menyimpan logo');
                    }
                }

                // Generate and send document via email
                const emailResponse = await fetch(`http://localhost:3000/api/pks/${pksId}/send-email`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });

                if (!emailResponse.ok) {
                    throw new Error('Gagal mengirim email');
                }

                alert('Data perjanjian berhasil disimpan dan email telah dikirim!');
                window.location.href = 'index.html'; // Redirect to index page

            } catch (error) {
                console.error('Error:', error);
                alert('Terjadi kesalahan: ' + error.message);
            }
        });

        // Cancel button functionality
        document.getElementById('cancelButton').addEventListener('click', function () {
            if (confirm('Apakah Anda yakin ingin membatalkan pengisian form?')) {
                window.location.href = 'index.html';
            }
        });
    </script>
</body>

</html>
