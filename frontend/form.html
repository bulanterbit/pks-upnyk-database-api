<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Perjanjian Kerja Sama</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
        .navbar-custom {
            background-color: #2e7d32;
            padding: 15px 0;
        }
        .navbar-brand {
            color: white !important;
            font-weight: bold;
            margin-left: 20px;
            font-size: 24px;
        }
        body {
            font-size: 14px;
        }
        .form-section {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .section-title {
            background-color: #f8f9fa;
            padding: 8px;
            margin-bottom: 15px;
            border-radius: 5px;
            font-size: 16px;
        }
        .form-label {
            font-size: 14px;
            margin-bottom: 5px;
        }
        .form-control, .form-select, .btn {
            font-size: 14px;
            padding: 6px 12px;
        }
        .cols-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }
        @media (max-width: 768px) {
            .cols-3 {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
  <header class="bg-green-700 text-white shadow-md">
    <div class="container mx-auto flex justify-between items-center px-6 py-4">
      <div class="flex items-center">
        <img src="img/logo_upn.png" alt="Logo" class="h-12 mr-4" />
        <h1 class="text-2xl font-bold">Form Kerjasama</h1>
      </div>
    </div>
  </header>

  <div class="container mx-auto px-6 py-8">
    <a href="index.html" class="text-green-600 hover:text-green-800 flex items-center">
      <i class="fas fa-arrow-left mr-2"></i> Kembali ke Daftar PKS
    </a>
  </div>

    <div class="container  mb-4">
        <form id="perjanjianForm">
            <!-- Informasi Dokumen - Only keep Judul Perjanjian -->
            <div class="form-section">
                <div class="section-title">
                    <h2 style="font-size: 16px;">Informasi Dokumen</h2>
                </div>
                <div class="cols-3">
                    <div class="form-elem">
                        <label class="form-label">Judul Perjanjian</label>
                        <input type="text" class="form-control" name="dokumen.judul" placeholder="Judul perjanjian" required>
                    </div>
                </div>
            </div>

            <!-- Pihak Kedua (Mitra) -->
            <div class="form-section">
                <div class="section-title">
                    <h2 style="font-size: 16px;">Pihak Kedua (Mitra)</h2>
                </div>
                <div class="cols-3">
                    <div class="form-elem">
                        <label class="form-label">Nama Perwakilan</label>
                        <input type="text" class="form-control" name="pihakKedua.nama" placeholder="Nama perwakilan" required>
                    </div>
                    <div class="form-elem">
                        <label class="form-label">Institusi/Perusahaan</label>
                        <input type="text" class="form-control" name="pihakKedua.institusi" placeholder="Nama institusi mitra" required>
                    </div>
                    <div class="form-elem">
                        <label class="form-label">Alamat</label>
                        <input type="text" class="form-control" name="pihakKedua.alamat" placeholder="Alamat mitra">
                    </div>
                    <div class="form-elem">
                        <label class="form-label">Jabatan</label>
                        <input type="text" class="form-control" name="pihakKedua.jabatan" placeholder="Jabatan perwakilan" required>
                    </div>
                    <div class="form-elem">
                        <label class="form-label">Nama Kontak</label>
                        <input type="text" class="form-control" name="pihakKedua.kontakNama" placeholder="Nama kontak mitra">
                    </div>
                    <div class="form-elem">
                        <label class="form-label">Email Kontak</label>
                        <input type="email" class="form-control" name="pihakKedua.kontakEmail" placeholder="Email mitra" required>
                    </div>
                    <div class="form-elem">
                        <label class="form-label">Telepon Kontak</label>
                        <input type="tel" class="form-control" name="pihakKedua.kontakTelp" placeholder="Telepon mitra">
                    </div>
                    <div class="form-elem">
                        <label class="form-label">Logo Mitra</label>
                        <input type="file" class="form-control" name="pihakKedua.fileLogo" accept="image/*">
                    </div>
                </div>
            </div>

            <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                <button type="button" class="btn btn-secondary me-md-2 btn-sm">Batal</button>
                <button type="submit" class="btn btn-primary btn-sm">Simpan Perjanjian</button>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Form submission - Save data to backend API
        document.getElementById('perjanjianForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            try {
                // Collect form data
                const formData = new FormData(this);
                const data = {};
                
                // Convert FormData to object
                formData.forEach((value, key) => {
                    // Handle nested objects
                    const keys = key.split('.');
                    let current = data;
                    
                    for (let i = 0; i < keys.length - 1; i++) {
                        if (!current[keys[i]]) {
                            current[keys[i]] = {};
                        }
                        current = current[keys[i]];
                    }
                    
                    current[keys[keys.length - 1]] = value;
                });
                
                // Add current user as creator
                data.dibuatOleh = "admin"; // Replace with actual user from your auth system
                
                // Send data to backend API
                const response = await fetch('http//localhost:3000/api/pks', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });
                
                if (!response.ok) {
                    throw new Error('Gagal menyimpan data');
                }
                
                const result = await response.json();
                
                alert('Data perjanjian berhasil disimpan!');
                this.reset();
                
            } catch (error) {
                console.error('Error:', error);
                alert('Terjadi kesalahan saat menyimpan data: ' + error.message);
            }
        });
    </script>
</body>
</html>
