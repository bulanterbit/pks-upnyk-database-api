services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env.production
    environment:
      - DB_URI=mongodb://mongo:27017/lppm-archive
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      - mongo
    restart: unless-stopped
    # simpan file upload di volume persisten
    volumes:
      - uploads:/app/uploadedFile

  web:
    image: caddy:2.8-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend:/site:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mongo-data:
  caddy-data:
  caddy-config:
  uploads:
